    (D.ceo_pending||[]).map(x=>`${x[0]} ×${x[1]}`).join('、') + `。</p>`;

$('ceoAct').innerHTML = `<h4><span>下一期我自己要改的</span></h4><ul>` +
  (ceo.actions||[]).map(a=>`<li><span class="tag">${esc(a.k)}</span>${md(a.t)}</li>`).join('')
  + '</ul>';

$('acts').innerHTML = (D.analysts||[]).map(p=>{
  const v = p.vs_blind ?? '樣本不足';
  return `<div class="act"><h4><span>${esc(p.name)}</span>
    <span class="meta">已到期 ${p.claims_scored||0}　命中 ${pc(p.fwd_hit)}　${esc(v)}</span></h4>
    <ul>` + (p.actions||[]).map(a=>
      `<li><span class="tag">${esc(a.k)}</span>${md(a.t)}</li>`).join('') + `</ul></div>`;
}).join('');

$('recent').innerHTML =
  `<thead><tr><th>到期日</th><th>研究員</th><th>標的</th><th>期限</th><th>方向</th>
   <th class="n">當時</th><th class="n">到期</th><th class="n">報酬</th><th>方向</th>
   <th>觸及</th><th class="n">最大逆向</th></tr></thead><tbody>` +
  (D.recent||[]).map(r=>`<tr><td class="faint">${r.resolve_at}</td>
    <td class="who">${esc(r.name)}</td><td class="dim">${esc(r.asset)}</td>
    <td class="dim">${HL[r.horizon]||r.horizon}</td>
    <td class="${r.direction==='up'?'up':r.direction==='down'?'down':'dim'}">${esc(r.direction)}</td>
    <td class="n faint">${num(r.p0)}</td><td class="n faint">${num(r.p1)}</td>
    <td class="n">${sg(r.ret)}</td>
    <td>${r.hit?'<span class="up">✓</span>':'<span class="down">✗</span>'}</td>
    <td>${r.tgt==null?'<span class="faint">—</span>':r.tgt?'<span class="up">✓</span>':'<span class="down">✗</span>'}</td>
    <td class="n">${sg(r.mae)}</td></tr>`).join('') + '</tbody>';

$('foot').innerHTML =
  `<b>怎麼讀這一頁：</b>「命中」只問方向對錯，門檻是 ±3%。一天期限的「區間」` +
  `本來就有八成機率會中，所以在那一格拿高命中率不是能力的證據——` +
  `每個指標旁邊的<b>盲猜期望</b>才是該比的對象。<br><br>` +
  `<b>最大逆向</b>是期間內最深的反向幅度。方向最後對了、中途卻逆向超過一成的判斷，` +
  `實務上多半已經被洗掉，不該跟一路順風的同分。`;
</script>
