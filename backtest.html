    <td class="dim">${HL[r.horizon]||r.horizon}</td>
    <td class="${r.direction==='up'?'up':r.direction==='down'?'down':'dim'}">${esc(r.direction)}</td>
    <td class="n faint">${num(r.p0)}</td><td class="n faint">${num(r.p1)}</td>
    <td class="n">${sg(r.ret)}</td>
    <td>${r.hit?'<span class="up">✓</span>':'<span class="down">✗</span>'}</td>
    <td>${r.tgt==null?'<span class="faint">—</span>':r.tgt?'<span class="up">✓</span>':'<span class="down">✗</span>'}</td>
    <td class="n">${sg(r.mae)}</td></tr>`).join('') + '</tbody>';

$('foot').innerHTML =
  `<b>怎麼讀這一頁：</b>「命中」只問方向對錯，門檻是 ±3%。一天期限的「區間」` +
  `本來就有八成機率會中，所以在那一格拿高命中率不是能力的證據——` +
  `每個指標旁邊的<b>盲猜期望</b>才是該比的對象。<br><br>` +
  `<b>最大逆向</b>是期間內最深的反向幅度。方向最後對了、中途卻逆向超過一成的判斷，` +
  `實務上多半已經被洗掉，不該跟一路順風的同分。`;
</script>
