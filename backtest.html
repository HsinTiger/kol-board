<h3>CEO 本期結算</h3>
<p class="lead">我的判斷跟六位走同一套規則。<b>命中率看方向對錯，Brier 罰的是機率給得對不對</b>——
兩個一起看才知道成績是實力還是題目簡單。</p>

<h3>六位研究員 · 下一期怎麼用他們</h3>
<p class="lead"><b>只放有統計依據的建議，沒有就明說沒有。</b>分項（期限、行情）要至少 20 條才列出，
而且標明「未檢定」。這一頁先前給過沒有依據的建議——例如「只在一季期限參考他」，
而一季期限根本沒被檢定過——已經拿掉。</p>
