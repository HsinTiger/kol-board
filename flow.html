<style>
:root{
  --ground:#f6f4f0; --panel:#fffefc; --edge:#ded8ce; --edge-soft:#ece7de;
  --fg:#1c1f26; --dim:#6d7688; --faint:#9aa2b1;
  --amber:#a9702c; --amber-soft:#f0e2cd;
  --jade:#2f7a58; --rust:#a8422f;
  --sans:"IBM Plex Sans","Noto Sans TC",-apple-system,sans-serif;
  --cond:"IBM Plex Sans Condensed","Noto Sans TC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#11141b; --panel:#171b24; --edge:#2b3140; --edge-soft:#212632;
  --fg:#e4e6ec; --dim:#8b93a5; --faint:#666e80;
  --amber:#d9963f; --amber-soft:#33281a;
  --jade:#4fa87a; --rust:#cf6a52;
}}
:root[data-theme="dark"]{
  --ground:#11141b; --panel:#171b24; --edge:#2b3140; --edge-soft:#212632;
  --fg:#e4e6ec; --dim:#8b93a5; --faint:#666e80;
  --amber:#d9963f; --amber-soft:#33281a;
  --jade:#4fa87a; --rust:#cf6a52;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--fg);font:400 15px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:40px 22px 96px}
.eyebrow{font:600 11px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
h1{font:600 30px/1.15 var(--cond);margin:10px 0 6px;text-wrap:balance;letter-spacing:-.01em}
.stamp{font:400 12px/1.5 var(--mono);color:var(--faint)}
.verdict{margin:28px 0 34px;padding:20px 22px;background:var(--panel);
  border:1px solid var(--edge);border-left:3px solid var(--amber);border-radius:2px}
.verdict h2{font:600 17px/1.35 var(--cond);margin:0 0 8px}
.verdict p{margin:0;color:var(--dim);font-size:14px;max-width:64ch}
.verdict b{color:var(--fg);font-weight:500}
h3{font:600 12px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);margin:40px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--edge-soft)}
.rail{display:flex;flex-wrap:wrap;gap:26px;padding:16px 0;border-block:1px solid var(--edge-soft)}
.rail div{min-width:88px}
.rail .k{font:500 10px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.rail .v{font:500 21px/1.2 var(--mono);margin-top:5px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font:500 10px/1 var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  text-align:left;padding:0 10px 9px;white-space:nowrap}
td{padding:11px 10px;border-top:1px solid var(--edge-soft);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--panel)}
.who{font-weight:500;white-space:nowrap}
.chip{display:inline-block;font:500 11px/1.5 var(--cond);letter-spacing:.04em;
  padding:1px 8px;border-radius:2px;border:1px solid var(--edge);color:var(--dim);white-space:nowrap}
.chip.pend{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.chip.down{border-color:var(--rust);color:var(--rust)}
.up{color:var(--jade)}.down{color:var(--rust)}.dim{color:var(--dim)}.faint{color:var(--faint)}
.q{color:var(--dim);font-size:12.5px;line-height:1.5;max-width:34ch}
.bar{display:inline-block;width:52px;height:5px;background:var(--edge-soft);
  border-radius:1px;overflow:hidden;vertical-align:middle;margin-right:7px}
.bar i{display:block;height:100%;background:var(--amber)}
.hgroup{margin:20px 0 0}
.hgroup h4{font:600 13px/1 var(--cond);letter-spacing:.06em;margin:0 0 2px;
  display:flex;align-items:baseline;gap:10px}
.hgroup .split{font:400 12px/1 var(--mono);color:var(--dim)}
.note{color:var(--faint);font-size:12.5px;margin-top:14px;max-width:66ch}
.foot{margin-top:52px;padding-top:18px;border-top:1px solid var(--edge-soft);
  color:var(--faint);font-size:12.5px;max-width:66ch}

/* ── CEO 判斷 ── */
.ceorec{margin:14px 0 4px;padding:13px 16px;background:var(--panel);
  border:1px solid var(--edge);border-left:3px solid var(--jade);border-radius:2px;
  font-size:13.5px;color:var(--dim);max-width:none}
.ceorec b{color:var(--fg);font-weight:500}
.assetrow{font:600 11px/1 var(--cond);letter-spacing:.14em;color:var(--amber);
  margin:26px 0 10px}
.calls{display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:12px}
.call{background:var(--panel);border:1px solid var(--edge);border-radius:2px;
  padding:15px 17px;display:flex;flex-direction:column}
.call.stale{opacity:.45}
.call .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.call .h{font:600 14px/1.2 var(--cond);letter-spacing:.04em}
.call .p{font:500 22px/1 var(--mono);font-variant-numeric:tabular-nums}
.pbar{height:4px;background:var(--edge-soft);border-radius:1px;overflow:hidden;margin:9px 0 3px}
.pbar i{display:block;height:100%;background:var(--jade)}
.pbar.d i{background:var(--rust)}
.call .lv{font:400 11.5px/1.5 var(--mono);color:var(--faint);margin-top:4px}
.call .th{font-size:13px;line-height:1.62;color:var(--dim);margin:9px 0 0;flex:1}
.call .th b{color:var(--fg);font-weight:500}
.call .inv{font-size:12.5px;line-height:1.55;color:var(--rust);
  border-top:1px solid var(--edge-soft);padding-top:9px;margin-top:11px}
.call .dv{font-size:12.5px;line-height:1.55;color:var(--dim);margin-top:9px;
  padding-left:10px;border-left:2px solid var(--edge)}
.call .dv b{color:var(--fg);font-weight:500}
tr.ceorow td{background:color-mix(in srgb,var(--jade) 8%,transparent);font-weight:500}
tr.ceorow td:first-child{box-shadow:inset 3px 0 0 var(--jade)}

.st.no{border-color:var(--rust);color:var(--rust)}
.st.pend{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.st.ex{color:var(--faint)}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--edge-soft);border-radius:2px}
.stn{padding:11px 12px;border-left:1px solid var(--edge-soft);min-width:0}

.stn .b b{color:var(--fg);font-weight:500}
.stn .q{color:var(--fg);font-size:13px;line-height:1.65}

.kv dt{color:var(--faint)}.kv dd{margin:0;color:var(--dim);font-variant-numeric:tabular-nums}

.mark{font:500 13px/1 var(--mono)}
.ok{color:var(--jade)}.no{color:var(--rust)}
.cav{margin-top:9px;padding:8px 11px;border-left:2px solid var(--amber);background:var(--amber-soft);

.cav b{font-weight:500}
.cav div+div{margin-top:3px}
.sec{font:600 12px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);

.foot2{margin-top:14px;font-size:12.5px;color:var(--faint)}
.empty{padding:18px 16px;color:var(--faint);font-size:13px}

  .stn{border-left:0;border-top:1px solid var(--edge-soft)}

    : c.status==='待到期' ? `<span class="st pend">待到期 ${c.resolve||''}</span>`
    : `<span class="st ex">${esc(c.status)}</span>`;
  const cav = (c.caveats||[]).length ? `<div class="cav">${c.caveats.map(x=>`<div>⚠ ${md(x)}</div>`).join('')}</div>` : '';
  const kindLabel = c.ctype==='floor' ? `底線 ${num(c.level)}` : c.ctype==='ceiling' ? `天花板 ${num(c.level)}` : (DIR[c.direction]||'');
  return `<div class="claim"><div class="chead"><span class="t">主張 ${i+1}　${esc(c.asset)} ${HL[c.horizon]||''} ${kindLabel}</span>${st}</div>

}

        <div class="stn"><div class="n">1</div><div class="h">論述</div><div class="b">${md(c.thesis)}</div></div>
        <div class="stn"><div class="n">2</div><div class="h">證偽條件</div><div class="b">${md(c.invalidation)}</div>
          ${c.key_levels?`<div class="b faint" style="margin-top:6px">${md(c.key_levels)}</div>`:''}</div>
        <div class="stn"><div class="n">3</div><div class="h">稽核閘門</div><div class="b"><span class="ok">✓</span> 證偽條件必填（寫不出「什麼情況算我錯」就存不進去）；自檢第 10 項核對價格定義與研究員一致。</div></div>
        <div class="stn"><div class="n">4</div><div class="h">計分設定</div><dl class="kv">
          <dt>到期日</dt><dd><b>${c.resolve_at}</b></dd>
          <dt>進場價</dt><dd>${num(c.p0)}</dd></dl>
          <div class="b" style="margin-top:6px"><b>收盤命中：</b>${esc(CEORULE[c.stance]||'')}</div>
          <div class="b" style="margin-top:4px"><b>Brier：</b>(P(up) − 實際漲跌)²，越低越好，固定喊 50% 是 0.250</div></div>
        <div class="stn"><div class="n">5</div><div class="h">結果</div>${done?`<dl class="kv">
          <dt>到期價</dt><dd>${num(c.p1)}</dd>
          <dt>報酬</dt><dd><b class="${c.ret>0?'up':c.ret<0?'down':''}">${pc(c.ret,2)}</b></dd>
          <dt>收盤命中</dt><dd>${MK(c.hit)}</dd>
          <dt>Brier</dt><dd class="${c.brier>0.25?'no':'ok'}">${c.brier!=null?c.brier.toFixed(3):'—'}</dd></dl>`
          : `<div class="b">還有 <b>${dayDiff(D.today,c.resolve_at)} 天</b>到期。</div>`}</div>
      </div></div></article>`;
  }).join('');
}

function render(){
  $('pick').innerHTML = tabs.map((n,i)=>`<button type="button" id="t-${i}" aria-pressed="${i===cur}" data-i="${i}">${esc(n)}</button>`).join('');
  $('pick').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;try{localStorage.setItem('flow-pick',cur)}catch(e){}render();});
  if (cur === tabs.length-1){ $('body').innerHTML = `<h3 class="sec">CEO（我）最近的判斷</h3>` + ceoBlock(); return; }
  const p = D.people[cur];
  $('body').innerHTML =
    `<h3 class="sec">最新三部<small>只算有產出主張的影片；直播與一般影片都算</small></h3>` +
    (p.latest.length ? p.latest.map(videoBlock).join('') : '<div class="empty">還沒有萃取過的影片。</div>') +
    (p.resolved.length ? `<h3 class="sec">最近一部已完整結算的影片<small>最新三部多半還沒到期，看這部才看得到第 5 站怎麼打分數</small></h3>` + p.resolved.map(videoBlock).join('') : '') +
    `<div class="foot2">同一段期間有 ${p.skipped} 支影片被判定「不是行情分析」而沒有產出主張；近 30 天有 ${p.members30} 支會員限定影片抓不到。</div>`;
}

$('foot').innerHTML =
  `<b>這頁跟計分程式用同一份資料、同一套規則</b>（build_records.row_for），不是另寫一份。` +
  `已結算的數字與回測紀錄頁一致；待到期的「期中狀態」只是讓你看到流程走到哪，不影響分數。<br><br>` +
  `<b>已知限制都標在每條主張底下</b>：條件式主張目前不檢查條件是否觸發、區間主張用的是我們的 ±${(D.band*100).toFixed(0)}% 而不是他給的區間、` +
  `進場價已在目標區內時觸及是免費的、一季期限不進入檢定。這些是下一步要改的地方。`;
render();
</script>

<script>
(function(){
  // 標出目前這一頁
  var f = (location.pathname.split('/').pop() || 'index.html').replace(/(_public)?\.html$/, '');
  if (!f) f = 'index';
  document.querySelectorAll('.mnav a').forEach(function(a){
    if ((' ' + a.dataset.p + ' ').indexOf(' ' + f + ' ') >= 0) a.setAttribute('aria-current', 'page');
  });
  var mq = window.matchMedia('(max-width:820px)');
  // 表格 → 卡片：每格補上欄名。頁面是 JS 畫的、切換分析師會重畫，所以用 MutationObserver 持續補。
  function label(){
    document.querySelectorAll('table:not(.mlab):not(.keep)').forEach(function(t){
      var ths = [].map.call(t.querySelectorAll('thead th'), function(th){ return th.textContent.trim(); });
      if (ths.length < 3) return;                 // 兩欄以下的小表本來就塞得下
      t.querySelectorAll('tbody tr').forEach(function(tr){
        [].forEach.call(tr.children, function(td, i){
          if (!td.hasAttribute('data-label')) td.setAttribute('data-label', ths[i] || '');
        });
      });
      t.classList.add('mlab');
      if (mq.matches) t.classList.add('mcards');
    });
  }
  // 選單在手機上黏在頂端，捲到哪都能換人
  function stick(){
    var p = document.querySelector('.pick, .jump');
    if (p) p.classList.toggle('sticky-pick', mq.matches);
  }
  function relabel(){
    document.querySelectorAll('table.mlab').forEach(function(t){ t.classList.toggle('mcards', mq.matches); });
    stick();
  }
  var pend = false;
  new MutationObserver(function(){
    if (pend) return; pend = true;
    requestAnimationFrame(function(){ pend = false; label(); });
  }).observe(document.body, {childList: true, subtree: true});
  if (mq.addEventListener) mq.addEventListener('change', relabel);
  label(); stick();
})();
</script>
