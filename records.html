    `主張 ${s.total} 條：已結算 <b>${s.settled}</b>、待到期 ${s.pending}` +
    (s.excluded?`、期限或方向可疑而排除 ${s.excluded}`:'') + '。' +
    (p.unextracted ? ` <b>樣本還不完整，結論會隨萃取進度變動。</b>` : '');

  const R = v => (v>0?'+':'')+v.toFixed(2)+'R';
  $('lenses').innerHTML =
    lensTile('收盤命中','到期那天收盤，有沒有往他說的方向走超過 ±3%', s.close, pc, 0.05) +
    lensTile('目標觸及','期間內有沒有摸到他給的目標價', s.touch, pc, 0.05) +
    lensTile('開單 R',`照他的目標開單、停損 ${(D.stop*100).toFixed(0)}%，平均每筆賺賠幾 R`, s.trade, R, 0.10);

  const ms = Object.entries(s.months);
  $('months').innerHTML = ms.length ? ms.map(([m,v])=>
    `<div class="mo"><div class="m">${m}</div><div class="h">${pc(v.hit)}</div>
     <div class="r ${v.R==null?'faint':v.R>0?'up':'down'}">${v.R==null?'— R':R(v.R)}</div>
     <div class="meter"><i style="width:${Math.round(v.hit*100)}%"></i></div>
     <div class="m" style="margin-top:5px">n=${v.n}</div></div>`).join('')
    : '<div class="empty">還沒有已結算的月份</div>';
  renderRows();
}

function renderRows(){
  const p = D.people[cur];
  const rows = p.rows.filter(r => filt==='all' ? true
    : filt==='set' ? r.status==='已結算' : r.status==='待到期');
  const tgt = r => r.tl&&r.th&&r.tl!==r.th ? `${num(r.tl)}–${num(r.th)}` : (r.tl||r.th) ? num(r.tl||r.th) : '—';
  const mark = v => v==null ? '<span class="faint">—</span>' : v ? '<span class="ok">✓</span>' : '<span class="no">✗</span>';
  $('rec').innerHTML = !rows.length ? '<tbody><tr><td class="empty">這個篩選下沒有紀錄</td></tr></tbody>' :
  `<thead><tr><th>發言</th><th>標的</th><th>期限</th><th>方向</th><th>他給的條件</th>
   <th class="n">當時</th><th class="n">到期</th><th class="n">報酬</th>
   <th class="n">最大順向</th><th class="n">最大逆向</th>
   <th>收盤</th><th>觸及</th><th class="n">開單</th><th>狀態</th></tr></thead><tbody>` +
  rows.map(r=>{
    const set = r.status==='已結算';
    const st = set ? '' : `<span class="st ${r.status==='待到期'?'pend':'ex'}">${esc(r.status)}`+
      (r.status==='待到期'&&r.resolve?` ${r.resolve.slice(5)}`:'')+`</span>`;
    const cond = [`目標 ${tgt(r)}`, r.cond?`若 ${esc(r.cond)}`:'', r.fals?`錯的條件：${esc(r.fals)}`:'',
      r.note?`<span class="no">${esc(r.note)}</span>`:''].filter(Boolean).join('<br>');
    return `<tr class="${set?'':'pendrow'}"><td class="faint">${r.day}</td>
      <td class="dim">${esc(r.asset)}</td><td class="dim">${HL[r.horizon]||r.horizon}</td>
      <td class="${r.direction==='up'?'up':r.direction==='down'?'down':'dim'}">${DIR[r.direction]||r.direction}</td>
      <td class="cond">${cond}${r.quote?`<span class="qt">「${esc(r.quote.slice(0,70))}」</span>`:''}</td>
      <td class="n faint">${num(r.p0)}</td><td class="n faint">${num(r.p1)}</td>
      <td class="n">${sg(r.ret)}</td><td class="n">${sg(r.mfe)}</td><td class="n">${sg(r.mae)}</td>
      <td>${set?mark(r.hit):''}</td><td>${set?mark(r.touch):''}</td>
      <td class="n ${r.R==null?'faint':r.R>0?'up':'down'}">${r.R==null?(set?'—':''):(r.R>0?'+':'')+r.R.toFixed(2)+'R'}</td>
      <td>${st}</td></tr>`;
  }).join('') + '</tbody>';
}

['all','set','pend'].forEach(k=>{
  const id = {all:'f-all',set:'f-set',pend:'f-pend'}[k];
  $(id).onclick = () => { filt=k;
    ['f-all','f-set','f-pend'].forEach(x=>$(x).setAttribute('aria-pressed', x===id));
    renderRows(); };
});

$('foot').innerHTML =
  `<b>回測規則。</b>進場＝發言日收盤。到期價＝到期<b>當天</b>收盤（缺當天價格就標「缺價格」，不拿前一天頂上）。` +
  `「開單」用他給的目標、停損固定 ${(D.stop*100).toFixed(0)}%；期間內先碰到哪個算哪個，都沒碰到就到期平倉。` +
  `<b>同一根日 K 同時碰到目標與停損時算停損先中</b>——日線看不出盤中順序，往有利方向猜會系統性高估。<br><br>` +
  `<b>盲猜基準</b>是同一個標的、同一個期限、同一個目標距離，隨機挑一天進場的結果。` +
  `山寨指數（ALT）是市值加總、沒有盤中高低，無法算觸及與開單。<br><br>` +
  `<b>「已排除」</b>是自動閘門判定期限或方向可疑的主張（例如目標價隱含一個月漲 400%），` +
  `那是我們的萃取誤差，不算在他頭上。`;
render();
</script>
